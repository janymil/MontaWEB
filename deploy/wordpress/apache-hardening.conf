# MontaWeb WordPress hardening (Apache layer). Caddy in front repeats the most
# important blocks, so either layer alone is enough.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Never execute PHP where files can be uploaded.
<Directory /var/www/html/wp-content/uploads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    <FilesMatch "\.(php[0-9]?|phtml|phar|pht|phps|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

# XML-RPC is the favourite password-guessing endpoint; nothing we use needs it.
<Files "xmlrpc.php">
    Require all denied
</Files>

# Hidden files and config backups.
<FilesMatch "^\.|\.(bak|old|orig|save|swp|sql|log|ini)$|^wp-config">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header unset X-Powered-By
