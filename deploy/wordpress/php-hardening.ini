; MontaWeb WordPress PHP settings (replaces the old per-site php-custom.ini)
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off
; Typical webshell helpers. WordPress core and our plugins do not need them.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source
session.cookie_httponly = 1
session.cookie_secure = 1
